{% extends "base.html" %} {% block content %}
<div class="container mt-5">
  <h1>
    ¿Estás seguro de que deseas eliminar la facultad "{{ faculty.name }}"?
  </h1>
  <p class="text-white">Esta acción no se puede deshacer.</p>
  <form method="POST">
    {% csrf_token %}
    <div class="d-flex justify-content-start">
      <button type="submit" class="btn btn-danger me-3">Sí, eliminar</button>
      <a href="{% url 'faculty-list' %}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
