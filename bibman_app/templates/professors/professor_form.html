{% extends "base.html" %} {% block content %}
<div class="container mt-5">
  <h1>{{ view.object ? "Edit Professor" : "Add Professor" }}</h1>
  <form method="post">
    {% csrf_token %} {{ form.as_p }}
    <button type="submit" class="btn btn-success">Save</button>
    <a href="{% url 'professor-list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
