{% extends "base.html" %} {% block content %}
<div class="container mt-5">
  <h1>Are you sure you want to delete the major "{{ major.name }}"?</h1>
  <form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete it</button>
    <a href="{% url 'major-list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
