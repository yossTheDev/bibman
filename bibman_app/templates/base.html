<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Accefy - Gestor de Accesos{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        display: flex;
        flex-direction: column;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      body {
        background-color: #121212;
        color: white;
        font-family: "Arial", sans-serif;
      }

      .navbar {
        background-color: #222222;
      }

      .navbar-brand {
        font-weight: bold;
        font-size: 1.5rem;
      }

      .nav-link {
        color: white !important;
      }

      .nav-link:hover {
        color: #ff5722 !important;
      }

      .container {
        background-color: #1f1f1f;
        border-radius: 10px;
        padding: 10px;
        padding-inline: 25px;
      }

      .btn {
        border-radius: 20px;
      }

      .btn-primary {
        background-color: #ff5722;
        border-color: #ff5722;
      }

      .btn-primary:hover {
        background-color: #e64a19;
        border-color: #e64a19;
      }

      h1,
      h2 {
        font-weight: 600;
        color: #f1f1f1;
      }

      .card {
        background-color: #333333;
        border: none;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }

      .card-body {
        color: #bdbdbd;
      }

      .navbar-toggler-icon {
        color: white;
      }

      .navbar-nav .nav-item .nav-link {
        font-weight: 500;
      }

      .footer {
        background-color: #222222;
        color: #f1f1f1;
        text-align: center;
        padding: 15px;
        margin-top: auto;
      }

      .footer a {
        color: #ff5722;
        text-decoration: none;
      }

      .footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="/">Accefy</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="{% url 'student-list' %}"
                ><i class="fas fa-user-graduate"></i> Estudiantes</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'professor-list' %}"
                ><i class="fas fa-chalkboard-teacher"></i> Profesores</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'faculty-list' %}"
                ><i class="fas fa-building"></i> Facultades</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'department-list' %}"
                ><i class="fas fa-sitemap"></i> Departamentos</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'major-list' %}"
                ><i class="fas fa-cogs"></i> Especialidades</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container mt-4 mb-4">{% block content %} {% endblock %}</main>

    <footer class="footer">
      <p>© 2025 <strong>Accefy</strong> - Todos los derechos reservados</p>
      <p>
        Hecho con ❤️ por
        <a href="https://www.linkedin.com" target="_blank"
          >Equipo alfa buena maravilla onda dinamita escuadron lobo</a
        >
      </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
