{% extends "base.html" %} {% block content %}
<div class="container mt-5">
  <h1 class="mb-4">Person List</h1>
  <a href="{% url 'person-create' %}" class="btn btn-primary mb-3"
    >Add Person</a
  >
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Name</th>
        <th>Role</th>
        <th>Faculty</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for person in persons %}
      <tr>
        <td>{{ person.name }}</td>
        <td>{{ person.get_role_display }}</td>
        <td>{{ person.faculty }}</td>
        <td>
          <a
            href="{% url 'person-edit' person.id %}"
            class="btn btn-sm btn-warning"
            >Edit</a
          >
          <a
            href="{% url 'person-delete' person.id %}"
            class="btn btn-sm btn-danger"
            >Delete</a
          >
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
