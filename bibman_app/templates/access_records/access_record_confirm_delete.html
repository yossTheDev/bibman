{% extends "base.html" %} {% block content %}
<div class="container mt-5">
  <h1 class="text-white">
    ¿Estás seguro de que deseas eliminar este registro de acceso?
  </h1>
  <p class="text-white">Esta acción no se puede deshacer.</p>

  <form method="post">
    {% csrf_token %}
    <div class="d-flex justify-content-start">
      <button type="submit" class="btn btn-danger me-3">Sí, eliminar</button>
      <a href="{% url 'access-record-list' %}" class="btn btn-secondary">
        Cancelar
      </a>
    </div>
  </form>
</div>
{% endblock %}
